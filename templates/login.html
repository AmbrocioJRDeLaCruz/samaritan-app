{% extends "layout.html" %}

{% block title %}
  Login
{% endblock %}

{% block main %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-5">
    <div class="card border-0 shadow-sm rounded-4">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <i class="bi bi-person-lock text-primary display-4"></i>
          <h2>Iniciar Sesión</h2>
          <p class="text-muted small">Ingresa tus credenciales para acceder a Samaritan</p>
        </div>
        <form action="/login" method="post">
          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Correo Electrónico</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" name="email" placeholder="Ej. ejemplo@example.com" required autofocus>
            </div>
          </div>
          <div class="mb-4">
            <label for="password" class="form-label fw-semibold">Contraseña</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-key"></i></span>
              <input type="password" class="form-control" name="password" placeholder="********" required>
            </div>
          </div>
          
          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 shadow-sm">
            <i class="bi bi-box-arrow-in-right me-1"></i>Ingresar
          </button>

        </form>

        <div class="text-center mt-4 pt-3 border-top">
          <p class="mb-0 small text-muted">¿No tienes una cuenta? <a href="/register" class="text-decoration-none fw-semibold">Regístrate</a></p>
        </div>
      </div>
  </div>
</div>
{% endblock %}
