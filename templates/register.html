{% extends "layout.html" %}

{% block title %}
  Register
{% endblock %}

{% block main %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-5">
    <div class="card shadow-sm border-0 rounded-4">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <i class="bi bi-person-plus-fill text-primary display-4"></i>
          <h2>Registrarse</h2>
          <p class="text-muted small">Únete a la red de voluntarios comunitarios</p>
        </div>

        <div>
          <form action="/register" method="post">
              <div class="mb-3">
                <label for="name" class="form-label fw-semibold">Nombre Completo</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-person"></i></span>
                  <input type="text" class="form-control" name="name" placeholder="Juan Pérez" required>
                </div>
              </div>

              <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Correo Electrónico</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control" name="email" placeholder="ejemplo@email.com">
                </div>
              </div>

              <div class="mb-3">
                <label for="password" class="form-label fw-semibold">Contraseña</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-key"></i></span>
                  <input type="password" class="form-control" name="password" placeholder="********" required>
                </div>
              </div>
              
              <div class="mb-4">
                <label for="confirm_password" class="form-label fw-semibold">Confirmar Contraseña</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                  <input type="password" class="form-control" name="confirm_password" placeholder="********" required>
                </div>
              </div>

              <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 shadow-sm">
                <i class="bi bi-check-circle me-1"></i>Registrarse
              </button>

              <div class="text-center mt-4 pt-3 border-top">
                <p class="small text-muted mb-0">¿Ya tienes una cuenta? <a href="/login" class="text-decoration-none fw-semibold">Inicia sesión</a></p>
              </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
